name: vaulter-back

services:
  api:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
