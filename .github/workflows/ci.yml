name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Mesmo banco do docker-compose (PostgreSQL 18 + pgvector), para os testes e2e.
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: vaulter
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Mesmo S3 do docker-compose (LocalStack 4.14.0, a última sem LOCALSTACK_AUTH_TOKEN), para o e2e do storage.
      aws:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
          # Confere a assinatura das URLs assinadas, como o S3 (o padrão do LocalStack é ignorá-la).
          S3_SKIP_SIGNATURE_VALIDATION: "0"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: vaulter
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      DB_APP_USERNAME: vaulter_app
      DB_APP_PASSWORD: vaulter_app
      # Valores só de teste (nada disso é segredo real).
      PROBLEM_TYPE_BASE_URL: https://errors.example.invalid
      API_DOCS_TITLE: API
      API_DOCS_INTERNAL_ENABLED: "true"
      LOG_LEVEL: silent
      AUTH_JWT_ISSUER: http://localhost:3000
      AUTH_JWT_AUDIENCE: http://localhost:3000
      AUTH_JWT_KEY_ID: ci-1
      AUTH_JWT_SIGNING_SEED: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      IDENTITY_DECOY_SALT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      HUB_CODE_HASH_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      IDENTITY_RECOVERY_HASH_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_HUB_BRAIN: vaulter-hub-brain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Mesmo SQL do .docker/postgres/init/02-app-role.sh: login de runtime da API.
      - name: Create runtime database role
        run: |
          psql "postgresql://vaulter:vaulter@localhost:5432/vaulter" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_runtime') THEN
              CREATE ROLE app_runtime NOLOGIN NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vaulter_app') THEN
              CREATE ROLE vaulter_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'vaulter_app';
            END IF;
          END
          $$;
          GRANT app_runtime TO vaulter_app;
          SQL
      # Migra o banco do job (DB_DATABASE) e confere que as entidades descrevem exatamente esse schema:
      # o schema:check falha se o schema:log do TypeORM imprimir qualquer SQL (drift = falta migration).
      - run: npm run migration:run
      - run: npm run schema:check
      # Mesmo script do compose (.docker/localstack/init/ready.d): bucket versionado + regras de ciclo de vida.
      - name: Create S3 bucket (LocalStack)
        run: |
          docker cp .docker/localstack/init/ready.d/01-buckets.sh "${{ job.services.aws.id }}:/tmp/01-buckets.sh"
          docker exec -e S3_BUCKET_HUB_BRAIN "${{ job.services.aws.id }}" bash /tmp/01-buckets.sh
      - run: npm run test:e2e
